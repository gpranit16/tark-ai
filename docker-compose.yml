services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tarkai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tarkai}
      POSTGRES_USER: ${POSTGRES_USER:-tarkai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tarkai_postgres_data:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tarkai} -d ${POSTGRES_DB:-tarkai}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tarkai_postgres_data:
